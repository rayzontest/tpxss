<!DOCTYPE html>

<head>
<title>Sales Chart Template</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
h1 { color: #333; margin-bottom: 20px; }
.chart { display: flex; align-items: flex-end; gap: 12px; height: 250px; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #ddd; }
.bar { width: 50px; border-radius: 4px 4px 0 0; position: relative; }
.bar span { position: absolute; top: -22px; width: 100%; text-align: center; font-size: 12px; color: #555; }
.label { text-align: center; font-size: 11px; margin-top: 6px; color: #777; }
.legend { margin-top: 20px; font-size: 13px; color: #666; }
.hidden { display: none; }
</style>
</head>
<body>

<h1>Q4 Sales Performance</h1>

  <div><div class="bar" style="height:220px;background:#2196F3;"><span>220k</span></div><div class="label">Nov</div></div>
  <div><div class="bar" style="height:195px;background:#FF9800;"><span>195k</span></div><div class="label">Dec</div></div>
  <div><div class="bar" style="height:250px;background:#9C27B0;"><span>250k</span></div><div class="label">Jan</div></div>
  <div><div class="bar" style="height:210px;background:#F44336;"><span>210k</span></div><div class="label">Feb</div></div>
